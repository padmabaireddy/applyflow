services:
  - type: web
    name: applyflow
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build && mkdir -p ../backend/static && cp -r dist/* ../backend/static/
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DEMO_PASSWORD
        value: demo
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REMINDER_WEBHOOK_URL
        sync: false
